<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ChurnShield AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ── Sidebar Navigation ───────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <span class="logo-icon">⚡</span>
    <span class="logo-text">ChurnShield<span class="logo-accent">AI</span></span>
  </div>

  <nav class="sidebar-nav">
    <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint=='index' %}active{% endif %}">
      <span class="nav-icon">🏠</span><span class="nav-label">Overview</span>
    </a>
    <a href="{{ url_for('predict') }}" class="nav-item {% if request.endpoint=='predict' %}active{% endif %}">
      <span class="nav-icon">🔮</span><span class="nav-label">Predict</span>
    </a>
    <a href="{{ url_for('batch') }}" class="nav-item {% if request.endpoint=='batch' %}active{% endif %}">
      <span class="nav-icon">📂</span><span class="nav-label">Batch Upload</span>
    </a>
    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint=='dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="model-badge">
      <span class="badge-dot"></span>
      <span class="badge-text">Model Active</span>
    </div>
  </div>
</aside>

<!-- ── Main Content ─────────────────────────────────────────────────── -->
<main class="main-content">
  <header class="top-bar">
    <div class="top-bar-title">{% block page_title %}ChurnShield AI{% endblock %}</div>
    <div class="top-bar-right">
      <div class="live-badge"><span class="pulse-dot"></span> Live System</div>
      <div class="date-display" id="liveClock"></div>
    </div>
  </header>

  <div class="page-body">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
